<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Automated LinkedIn Content Pipeline n8n workflow</title>
  <desc id="desc">A dark workflow canvas showing scheduled research, topic scoring, AI post generation, quality branching, LinkedIn publishing, and audit logging.</desc>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#27303a"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .node { fill:#20262d; stroke:#3a444e; stroke-width:2; rx:8; }
      .node-title { fill:#e8edf1; font:600 15px Arial,sans-serif; }
      .node-sub { fill:#87939e; font:12px Arial,sans-serif; }
      .wire { fill:none; stroke:#66727d; stroke-width:3; }
      .port { fill:#161b20; stroke:#6d7983; stroke-width:2; }
      .accent { fill:#65c4b8; }
      .orange { fill:#f5a623; }
    </style>
  </defs>
  <rect width="1280" height="620" fill="#11161a"/>
  <rect width="1280" height="620" fill="url(#grid)"/>
  <path class="wire" d="M120 310 C160 310 160 220 205 220 M120 310 C160 310 160 400 205 400 M290 220 C340 220 340 310 390 310 M290 400 C340 400 340 310 390 310 M475 310 H545 M630 310 H700 M785 310 H855 M940 310 H1010 M1095 310 C1130 310 1130 230 1170 230 M1095 310 C1130 310 1130 400 1170 400"/>
  <g filter="url(#shadow)">
    <rect class="node" x="35" y="275" width="85" height="70"/>
    <circle cx="77" cy="299" r="13" fill="none" stroke="#d8e0e6" stroke-width="2"/><path d="M77 291v9l6 4" stroke="#d8e0e6" stroke-width="2" fill="none"/>
    <text class="node-title" x="77" y="330" text-anchor="middle">Daily</text><text class="node-sub" x="77" y="359" text-anchor="middle">Schedule</text>

    <rect class="node" x="205" y="185" width="85" height="70"/><text class="node-title" x="247" y="216" text-anchor="middle">RSS Read</text><text class="node-sub" x="247" y="238" text-anchor="middle">Feed topics</text><circle class="orange" cx="247" cy="204" r="7"/>
    <rect class="node" x="205" y="365" width="85" height="70"/><text class="node-title" x="247" y="396" text-anchor="middle">Web Search</text><text class="node-sub" x="247" y="418" text-anchor="middle">Live research</text><circle class="accent" cx="247" cy="384" r="7"/>
    <rect class="node" x="390" y="275" width="85" height="70"/><text class="node-title" x="432" y="306" text-anchor="middle">Merge</text><text class="node-sub" x="432" y="328" text-anchor="middle">Deduplicate</text><path d="M424 292h16m-8-8v16" stroke="#65c4b8" stroke-width="2"/>
    <rect class="node" x="545" y="275" width="85" height="70"/><text class="node-title" x="587" y="306" text-anchor="middle">Score</text><text class="node-sub" x="587" y="328" text-anchor="middle">Best topic</text><text x="587" y="296" text-anchor="middle" fill="#f5a623" font-size="16">{ }</text>
    <rect class="node" x="700" y="275" width="85" height="70"/><text class="node-title" x="742" y="306" text-anchor="middle">Generate</text><text class="node-sub" x="742" y="328" text-anchor="middle">LLM draft</text><circle cx="742" cy="296" r="8" fill="#e8edf1"/>
    <rect class="node" x="855" y="275" width="85" height="70"/><text class="node-title" x="897" y="306" text-anchor="middle">Humanize</text><text class="node-sub" x="897" y="328" text-anchor="middle">QA score</text><path d="M890 296h14m-7-7v14" stroke="#65c4b8" stroke-width="2"/>
    <rect class="node" x="1010" y="275" width="85" height="70"/><text class="node-title" x="1052" y="306" text-anchor="middle">Quality</text><text class="node-sub" x="1052" y="328" text-anchor="middle">Score &gt;= 80?</text><path d="M1044 296l8-8 8 8-8 8z" fill="none" stroke="#f5a623" stroke-width="2"/>
    <rect class="node" x="1170" y="195" width="85" height="70"/><text class="node-title" x="1212" y="226" text-anchor="middle">LinkedIn</text><text class="node-sub" x="1212" y="248" text-anchor="middle">Auto-publish</text><rect x="1201" y="207" width="22" height="16" fill="#1683bb"/><text x="1212" y="220" text-anchor="middle" fill="white" font-size="12" font-weight="bold">in</text>
    <rect class="node" x="1170" y="365" width="85" height="70"/><text class="node-title" x="1212" y="396" text-anchor="middle">Review</text><text class="node-sub" x="1212" y="418" text-anchor="middle">Human fallback</text><path d="M1203 383h18v14h-18z" fill="none" stroke="#f5a623" stroke-width="2"/>
  </g>
  <text x="35" y="575" fill="#66727d" font-family="monospace" font-size="14">AUTOMATED LINKEDIN CONTENT PIPELINE  /  n8n  /  DAILY CONTENT OPS</text>
</svg>